spring.application.name=StapleTrack NG

# Secrets (the datasource password) live in application-local.properties, which git ignores.
# Copy application-local.properties.example to create it.
spring.profiles.active=local

# MySQL — createDatabaseIfNotExist lets a fresh server start without a manual CREATE DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/stapletrack?createDatabaseIfNotExist=true
spring.datasource.username=root

# Schema is owned by schema.sql (runs on every startup, idempotent via IF NOT EXISTS).
# Hibernate only checks that the entities match it and never alters tables.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate

# Reload templates without restarting during development
spring.thymeleaf.cache=false
